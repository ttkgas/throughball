# Full game state run, scored with GS-HOTA against SoccerNet's labels.
# Our setup run (throughball_setup) only detects, tracks and calibrates; GS-HOTA also needs each
# player's role, team and jersey number, so this adds sn-gamestate's modules for those,
# with PnLCalib calibration as in the setup run. Scores the whole clip (GS-HOTA on a few frames
# is meaningless, since the labels cover all of them). Run from the repo root:
#   MPLBACKEND=Agg third_party/sn-gamestate/.venv/bin/tracklab --config-dir configs -cn throughball_gsr
defaults:
  - dataset: soccernet_gs
  - eval: gs_hota
  - engine: offline
  - visualization: gamestate
  - modules/bbox_detector: yolo_ultralytics
  - modules/reid: prtreid
  - modules/track: bpbreid_strong_sort
  - modules/jersey_number_detect: mmocr
  - modules/team: kmeans_embeddings
  - modules/team_side: mean_position
  - modules/tracklet_agg: voting_role_jn
  - modules/pitch: pnlcalib
  - modules/calibration: pnlcalib
  - _self_

pipeline: [bbox_detector, reid, track, pitch, calibration, jersey_number_detect, tracklet_agg, team, team_side]

experiment_name: "throughball-gsr"
project_dir: "${hydra:runtime.cwd}"
data_dir: "${project_dir}/data"
model_dir: "${project_dir}/pretrained_models"

num_cores: 2
use_wandb: False
use_rich: False

modules:
  bbox_detector: {batch_size: 8}
  reid: {batch_size: 64}
  track: {batch_size: 64}
  pitch: {batch_size: 1}
  calibration: {batch_size: 1}
  jersey_number_detect: {batch_size: 8}

test_tracking: True
eval_tracking: True
print_config: False

dataset:
  nvid: 1
  eval_set: "valid"
  dataset_path: ${data_dir}/SoccerNetGS
  vids_dict:
    valid: ["SNGS-021"]

state:
  save_file: "states/${experiment_name}.pklz"
  load_file: null

visualization:
  cfg:
    save_videos: False

hydra:
  output_subdir: "configs"
  job:
    chdir: True
  run:
    dir: "outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}"

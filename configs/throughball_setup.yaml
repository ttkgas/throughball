# Setup run: detect + track players, calibrate the camera with PnLCalib,
# and draw players on the pitch (radar) for one GSR clip. Runs on CPU.
# Run from the repo root:
#   MPLBACKEND=Agg third_party/sn-gamestate/.venv/bin/tracklab --config-dir configs -cn throughball_setup
defaults:
  - dataset: soccernet_gs
  - eval: gs_hota
  - engine: offline
  - visualization: gamestate
  - modules/bbox_detector: yolo_ultralytics
  - modules/track: byte_track
  - modules/pitch: pnlcalib
  - modules/calibration: pnlcalib
  - _self_

pipeline:
  - bbox_detector
  - track
  - pitch
  - calibration

experiment_name: "throughball-setup"
project_dir: "${hydra:runtime.cwd}"
data_dir: "${project_dir}/data"
model_dir: "${project_dir}/pretrained_models"

num_cores: 2
use_wandb: False
use_rich: False

modules:
  bbox_detector: {batch_size: 4}
  track: {batch_size: 64}
  pitch: {batch_size: 1}
  calibration: {batch_size: 1}

test_tracking: True
eval_tracking: False  # GS-HOTA needs roles, teams and jersey numbers, which this run doesn't predict
print_config: False

dataset:
  nvid: 1
  nframes: 100  # 4 seconds of video keeps the CPU run short; -1 for the whole clip
  eval_set: "valid"
  dataset_path: ${data_dir}/SoccerNetGS
  vids_dict:
    valid: ["SNGS-021"]

state:
  save_file: "states/${experiment_name}.pklz"
  load_file: null

visualization:
  cfg:
    save_videos: True

hydra:
  output_subdir: "configs"
  job:
    chdir: True
  run:
    dir: "outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}"
